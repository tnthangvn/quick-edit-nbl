# Lint docs/api.json (pnpm api:lint)
extends:
  - recommended
rules:
  operation-operationId: error
  operation-tag-defined: error
  operation-4xx-response: off
  info-license: off
  no-server-example.com: off
  security-defined: off
  # Schema dùng chung (enum, event SSE) được đăng ký sẵn cho FE sinh type, kể cả khi chưa route nào tham chiếu.
  no-unused-components: off
