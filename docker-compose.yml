# Postgres cho dev khi DATA_DRIVER=POSTGRES. Bật: make db-up · Tắt: make db-down
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: spec_studio
      POSTGRES_PASSWORD: spec_studio
      POSTGRES_DB: spec_studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spec_studio -d spec_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
